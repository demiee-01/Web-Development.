<html lang="en">
<head>

    <style>
        .Continer{
            display: flex;

            width: 600px;

            /* oy flex-wrap smer width  */

            width: 300px;
        }
    </style>
    <title>flex-wrap</title>
</head>
<body>
        <!-- Flex Continer -->
     <section class="Continer">
        <!-- flex items 1-->
         <div>item-1</div>
        <!-- flex items 2-->
         <div>item-2</div>
        <!-- flex items 3-->
         <div>item-3</div>
        <!-- flex items 4-->
         <div>item-4</div>

     </section>
</body>
</html>
