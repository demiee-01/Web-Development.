<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- define style internal -->
    <style>
      div {
        background-color: red;
        display: inline;
      }
      small {
        display: block;
        background-color: aqua;
      }

      p {
        background-color: blueviolet;
        /* inline can define width or height  */
        display: inline-block;
        width: 300px;
        height: 100px;
      }
    </style>

    <title>Blcok , inline and inline-block</title>
  </head>
  <body>
    <!-- Block element -->
    <div>Block element</div>
    <!-- inline -->
    <small>inline element become block element</small>
    <!-- inline block -->
    <p>we about css page layout</p>
  </body>
</html>
