<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- intrernal style -->
     <style>
        /* use for position relative */
        #box-1{
            background-color: aqua;
            height: 100px;
            font-size: 32px;
            color: blueviolet;
            text-align: center;
            font-weight: bold;
            position: relative;
            top: 20px;
            left: 40px;
        }
         #box-2{
            background-color: rgb(0, 4, 255);
            height: 100px;
            font-size: 32px;
            color: rgb(251, 249, 252);
            text-align: center;
            font-weight: bold;
            position: relative;
        }
        #box-3{
            background-color: rgb(76, 240, 0);
            height: 500px;
            width: 500px;
            font-size: 32px;
            color: rgb(206, 19, 19);
            text-align: center;
            font-weight: bold;
            position: relative;
        }

        /* use for absolute for 3.1 */
        #box-3-1{
            background-color: rgb(21, 63, 2);
            height: 200px;
            width: 200px;
            font-size: 32px;
            color: rgb(255, 208, 0);
            text-align: center;
            font-weight: bold;
            position: absolute;
            transform: translateX(50%);
       
            
        }
         #box-4{
            background-color: rgb(21, 63, 2);
            height: 100px;
            width: 600px;
            font-size: 32px;
            color: rgb(255, 208, 0);
            text-align: center;
            font-weight: bold;
            position:fixed;
            
            
       
            
        }
        #box-5{
            background-color: rgb(145, 6, 187);
            height: 100px;
            width: 600px;
            font-size: 32px;
            color: rgb(19, 104, 214);
            text-align: center;
            font-weight: bold;
            position:sticky;
            top: 0px;
            
            
       
            
        }
     </style>
    <title>Psoition</title>
</head>
<body>
    <!-- relative 1 -->
     <div id="box-1">1.This element use with relative</div>

      <!-- relative 2 -->
     <div id="box-2">2.This element use with relative</div>

           <!-- relative 3 -->
     <div id="box-3">3.This element use with relative
        <div id="box-3-1">3.1This element use with absulote</div>
     </div>

     <!-- use for fixed -->
      <div id="box-4">4This element use with fixed</div>
      <div id="box-5">5.This element use with sticky</div>
      <h2 style="margin-bottom: 1000px;">scroll down</h2>
      <h2>scroll up</h2>
</body>
</html>
