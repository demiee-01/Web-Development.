<!-- file path: it tell for locaion about file in webiste -->
<!-- file path have 2 : Absolute( file in link on internet ) path and relative path ( file in local laptop )- -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Path</title>
    <!-- make logo in web page -->
    <link
      rel="shortcut icon"
      href="../image/logo-dog.jpg"
      type="image/x-icon"
    />
  </head>
  <body>
    <!-- It is Absolute  -->
    <img
      src="https://images.pexels.com/photos/16937962/pexels-photo-16937962.jpeg"
      width="250"
      alt="dog"
    />

    <!-- It is relative path -->
    <img src="../image/dog2.jpg" width="111" alt="Dog cute" />
  </body>
</html>
