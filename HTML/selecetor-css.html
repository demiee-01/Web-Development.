<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selctor with css type</title>
    <link rel="stylesheet" href="/CSS/type-selector.css" />
  </head>
  <body>
    <!-- use for id selectoe -->
    <h3 id="heading">This is content use id selector</h3>

    <!-- use for attribute selector-->
    <a href="#">Click me </a>

    <!-- cascade -->
    <h1 class="box">Cascading</h1>

    <!-- box -->
    <div>Box</div>

    <h1 class="boX">Cascading</h1>

    <!-- box -->
    <div class="hx">Box</div>
  </body>
</html>
