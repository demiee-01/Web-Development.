<!-- block vs inline -->
<!-- block do 1 row full weith when make , it still use new weith in webpage  -->
<!-- inline do for sensten not all ( 1 row page) -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Style -->
    <style>
      small {
        background-color: blueviolet;
        color: aliceblue;
      }
      div {
        color: aqua;

        background-color: antiquewhite;
      }
    </style>
    <title>Block-inline</title>
  </head>
  <body>
    <!-- it do about block element -->
    <div>
      <h2>This is block 1</h2>
      <h2>This is block 2</h2>
      <h2>This is block 3</h2>
    </div>

    <!-- it do about  inline element -->

    <small>This is inline element1</small>
    <small>This is inline element2</small>
    <small>This is inline element3</small>
  </body>
</html>
