<!-- file path: it tell for locaion about file in webiste -->
<!-- file path have 2 : Absolute( file in link on internet ) path and relative path ( file in local laptop )- -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Path</title>
  </head>
  <body>
    <!-- It is Absolute  -->
    <img
      src="https://images.pexels.com/photos/11710885/pexels-photo-11710885.jpeg"
      width="250"
      alt="dog"
    />

    <!-- It is relative path -->
    <img src="../image/dog1.jpg" width="150" alt="Dog cute" />
  </body>
</html>
