<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/Table-apply-in-css.css">
    <title>Table apply in css</title>
</head>
<body>
    <table border="1">
        <!-- Head -->
        <thead>
            <!-- make row heading -->
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Saving</th>
            </tr>

            <!-- make cell in body -->
             <tbody>
                <!-- row 1 -->
                <tr>
                    <!-- cell use td -->
                     <td>Kong</td>
                     <td>Fuu</td>
                     <td>$8800</td>
                </tr>
                <!-- row 2 -->
                <tr>
                    <!-- cell use td -->
                     <td>Bun</td>
                     <td>Bona</td>
                     <td>$5770</td>
                </tr>
                <!-- row 3 -->
                <tr>
                    <!-- cell use td -->
                     <td>Van</td>
                     <td>Errr</td>
                     <td>$5000</td>
                </tr>
             </tbody>
        </thead>
        <!-- body -->
    </table>
</body>
</html>
